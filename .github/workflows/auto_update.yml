name: Auto Update Dashboard

on:
  schedule:
    # Berjalan setiap menit ke-0 pada setiap jam
    - cron: '0 * * * *'
  workflow_dispatch: # Mengizinkan tombol manual trigger dari menu Actions

permissions:
  contents: write # Diperlukan agar robot bisa mengirim perubahan

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Generate Dashboard
        run: python generate_dashboard.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Dashboard_Lokal.html
          # Hanya commit jika ada perubahan data baru
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update Dashboard_Lokal.html via GitHub Actions"
          git push origin main
